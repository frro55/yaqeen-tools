<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<title>لوحة إدارة المستخدمين - أدوات يقين</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Tahoma, sans-serif;
    background: #f5f5f5;
    color: #1a1a1a;
    padding: 24px 16px;
  }

  /* ===== شاشة الدخول ===== */
  #loginScreen {
    min-height: 80vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .login-card {
    max-width: 380px;
    width: 100%;
    background: #fff;
    border: 3px solid #A3E635;
    border-radius: 16px;
    padding: 34px 26px;
    text-align: center;
    box-shadow: 0 4px 16px rgba(0,0,0,.08);
  }
  .login-card .icon { font-size: 44px; margin-bottom: 10px; }
  .login-card h1 { margin: 0 0 8px; font-size: 20px; }
  .login-card p { margin: 0 0 20px; color: #666; font-size: 13.5px; line-height: 1.8; }
  .login-card input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 12px;
    text-align: right;
    direction: ltr;
  }
  .login-card .error {
    color: #dc2626;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 12px;
    display: none;
  }

  /* ===== أزرار عامة ===== */
  .btn {
    display: inline-block;
    background: #A3E635;
    color: #1a1a1a;
    border: none;
    border-radius: 8px;
    padding: 11px 22px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
  }
  .btn:hover { background: #8fcf1e; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.secondary { background: #eee; color: #333; }
  .btn.secondary:hover { background: #ddd; }
  .btn.danger { background: #fecaca; color: #7f1d1d; }
  .btn.danger:hover { background: #fca5a5; }
  .btn.small { padding: 7px 14px; font-size: 12.5px; }

  /* ===== لوحة الإدارة ===== */
  #appScreen { display: none; max-width: 1100px; margin: 0 auto; }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    background: #fff;
    border: 1px solid #e5e5e5;
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 18px;
  }
  .topbar h1 { font-size: 18px; margin: 0; }
  .topbar .who { font-size: 12.5px; color: #666; }

  .panel {
    background: #fff;
    border: 1px solid #e5e5e5;
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 18px;
  }
  .panel h2 { font-size: 15px; margin: 0 0 14px; }

  .toolbar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  .toolbar input[type="text"], .toolbar input[type="email"] {
    padding: 10px 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 13.5px;
  }
  #searchInput { min-width: 220px; }

  .add-form {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 14px;
    align-items: center;
  }
  .add-form input { min-width: 200px; }
  .add-msg { font-size: 13px; font-weight: bold; }
  .add-msg.ok { color: #16a34a; }
  .add-msg.err { color: #dc2626; }

  table { width: 100%; border-collapse: collapse; }
  th, td {
    padding: 10px 8px;
    text-align: right;
    border-bottom: 1px solid #eee;
    font-size: 13.5px;
    vertical-align: top;
  }
  th { color: #666; font-size: 12.5px; }
  td.email { direction: ltr; text-align: right; color: #444; font-size: 12.5px; }
  td input[type="text"] {
    width: 100%;
    padding: 7px 9px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 13px;
  }

  .tools-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(140px, 1fr));
    gap: 4px 10px;
  }
  .tools-grid label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    cursor: pointer;
    white-space: nowrap;
  }

  .switch-row { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  .switch {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    font-size: 12.5px;
  }
  .switch input { display: none; }
  .switch .track {
    width: 34px;
    height: 19px;
    background: #ddd;
    border-radius: 999px;
    position: relative;
    transition: background .15s;
    flex-shrink: 0;
  }
  .switch .track::after {
    content: "";
    position: absolute;
    top: 2px;
    right: 2px;
    width: 15px;
    height: 15px;
    background: #fff;
    border-radius: 50%;
    transition: right .15s;
  }
  .switch input:checked + .track { background: #A3E635; }
  .switch input:checked + .track::after { right: 17px; }

  .row-actions { display: flex; flex-direction: column; gap: 6px; }
  .save-msg { font-size: 11.5px; color: #16a34a; font-weight: bold; }
  .save-msg.err { color: #dc2626; }

  .empty { text-align: center; color: #999; padding: 30px 0; font-size: 13.5px; }
</style>
</head>
<body>

  <!-- ===== شاشة الدخول ===== -->
  <div id="loginScreen">
    <div class="login-card">
      <div class="icon">🔐</div>
      <h1>لوحة إدارة المستخدمين</h1>
      <p>هذي الصفحة مخصصة للمدير فقط.<br>أدخل إيميلك للدخول.</p>
      <div class="error" id="loginError">تم رفض الدخول - هذا الحساب ليس أدمن أو غير مفعّل.</div>
      <input type="email" id="loginEmail" placeholder="admin@example.com" autocomplete="off">
      <button class="btn" style="width:100%" id="loginBtn">دخول</button>
    </div>
  </div>

  <!-- ===== لوحة الإدارة ===== -->
  <div id="appScreen">

    <div class="topbar">
      <h1>🛠 إدارة مستخدمي أدوات يقين</h1>
      <div>
        <span class="who" id="whoLabel"></span>
        <button class="btn secondary small" id="logoutBtn" style="margin-inline-start:10px;">تسجيل خروج</button>
      </div>
    </div>

    <div class="panel">
      <h2>➕ إضافة مستخدم جديد</h2>
      <div class="add-form">
        <input type="email" id="newEmail" placeholder="الإيميل">
        <input type="text" id="newName" placeholder="الاسم (اختياري)">
        <button class="btn" id="addBtn">إضافة</button>
        <span class="add-msg" id="addMsg"></span>
      </div>
    </div>

    <div class="panel">
      <h2>🤖 تعليمات شات AI</h2>
      <textarea id="aiPromptInput" rows="5" style="width:100%;box-sizing:border-box;padding:10px 12px;
        border:1px solid #ccc;border-radius:8px;font-size:13.5px;text-align:right;direction:rtl;
        font-family:inherit;resize:vertical;" placeholder="النص اللي يوجّه رد الذكاء الاصطناعي..."></textarea>
      <div style="margin-top:10px;display:flex;align-items:center;gap:10px;">
        <button class="btn small" id="aiPromptSaveBtn">💾 حفظ التعليمات</button>
        <span class="add-msg" id="aiPromptMsg"></span>
      </div>
    </div>

    <div class="panel">
      <div class="toolbar">
        <input type="text" id="searchInput" placeholder="بحث بالإيميل...">
        <button class="btn secondary small" id="refreshBtn">🔄 تحديث</button>
      </div>
    </div>

    <div class="panel" style="overflow-x:auto;">
      <table id="usersTable">
        <thead>
          <tr>
            <th>الإيميل</th>
            <th>الاسم</th>
            <th>الأدوات</th>
            <th>الحالة</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="usersBody"></tbody>
      </table>
      <div class="empty" id="emptyMsg" style="display:none;">لا يوجد مستخدمون مطابقون.</div>
    </div>

  </div>

<script>
  const API_BASE = "https://api.yaqeen-vip.space";

  // نفس مفاتيح tool_key الموجودة فعلياً بجدول tools بقاعدة البيانات -
  // أي تعديل بمفاتيح الجدول لازم ينعكس هنا يدوياً
  const TOOL_CATALOG = [
    { key: "fleet-inventory", label: "🚗 جرد الأسطول" },
    { key: "available-vehicles", label: "🚗 السيارات المتوفرة" },
    { key: "email-tools", label: "📧 إيميل" },
    { key: "payment-verify", label: "💳 تحقق من الدفع" },
    { key: "airport-report", label: "🛫 حجوزات المطار" },
    { key: "late-payments", label: "💰 المتأخرة (أفراد - جدة)" },
    { key: "late-payments-branches", label: "💰 المتأخرة (أفراد - فروع)" },
    { key: "company-extension", label: "🏢 عقود الشركات (جدة)" },
    { key: "company-extension-branches", label: "🏢 عقود الشركات (فروع)" },
    { key: "closed-as-debt", label: "📕 عقود أغلقت كمديونية" },
    { key: "customer-whatsapp-messages", label: "💬 رسائل واتساب للعميل" },
    { key: "booking-report", label: "📊 الحجوزات القادمة" },
    { key: "vip-booking-add", label: "⭐ إضافة حجز VIP" },
    { key: "ai-chat", label: "🤖 شات AI" },
  ];

  let adminEmail = localStorage.getItem("yaqeen_admin_email") || "";
  let allUsers = [];

  function postJson(path, body) {
    return fetch(API_BASE + path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    }).then(r => r.json()).catch(() => null);
  }

  function getJson(path) {
    return fetch(API_BASE + path).then(r => r.json()).catch(() => null);
  }

  // ===== تسجيل الدخول =====
  const loginScreen = document.getElementById("loginScreen");
  const appScreen = document.getElementById("appScreen");
  const loginEmailInput = document.getElementById("loginEmail");
  const loginError = document.getElementById("loginError");

  function tryLogin(email) {
    loginError.style.display = "none";
    return getJson("/api/admin/users?admin_email=" + encodeURIComponent(email)).then(data => {
      if (!data || data.success !== true) {
        loginError.style.display = "block";
        return false;
      }
      adminEmail = email;
      localStorage.setItem("yaqeen_admin_email", email);
      loginScreen.style.display = "none";
      appScreen.style.display = "block";
      document.getElementById("whoLabel").textContent = "مسجّل الدخول: " + email;
      allUsers = data.users || [];
      renderUsers();
      loadAiPrompt();
      return true;
    });
  }

  // ===== تعليمات شات AI =====
  function loadAiPrompt() {
    return getJson("/api/admin/ai-settings?admin_email=" + encodeURIComponent(adminEmail)).then(data => {
      if (!data || data.success !== true) return;
      document.getElementById("aiPromptInput").value = data.prompt || "";
    });
  }

  document.getElementById("aiPromptSaveBtn").addEventListener("click", () => {
    const btn = document.getElementById("aiPromptSaveBtn");
    const msg = document.getElementById("aiPromptMsg");
    const prompt = document.getElementById("aiPromptInput").value;

    btn.disabled = true;
    msg.textContent = "";
    msg.className = "add-msg";

    postJson("/api/admin/ai-settings", { admin_email: adminEmail, prompt: prompt }).then(res => {
      btn.disabled = false;
      if (!res || !res.success) {
        msg.textContent = res && res.message ? res.message : "فشل الحفظ";
        msg.className = "add-msg err";
        return;
      }
      msg.textContent = "تم الحفظ ✓";
      msg.className = "add-msg ok";
      setTimeout(() => { msg.textContent = ""; }, 2500);
    });
  });

  document.getElementById("loginBtn").addEventListener("click", () => {
    const email = loginEmailInput.value.trim().toLowerCase();
    if (!email) return;
    tryLogin(email);
  });
  loginEmailInput.addEventListener("keydown", e => {
    if (e.key === "Enter") document.getElementById("loginBtn").click();
  });

  document.getElementById("logoutBtn").addEventListener("click", () => {
    localStorage.removeItem("yaqeen_admin_email");
    adminEmail = "";
    appScreen.style.display = "none";
    loginScreen.style.display = "flex";
    loginEmailInput.value = "";
  });

  // ===== تحميل / عرض المستخدمين =====
  function loadUsers() {
    return getJson("/api/admin/users?admin_email=" + encodeURIComponent(adminEmail)).then(data => {
      if (!data || data.success !== true) return;
      allUsers = data.users || [];
      renderUsers();
    });
  }

  function renderUsers() {
    const query = document.getElementById("searchInput").value.trim().toLowerCase();
    const body = document.getElementById("usersBody");
    const emptyMsg = document.getElementById("emptyMsg");
    body.innerHTML = "";

    const filtered = allUsers.filter(u => !query || (u.email || "").toLowerCase().includes(query));

    if (filtered.length === 0) {
      emptyMsg.style.display = "block";
      return;
    }
    emptyMsg.style.display = "none";

    filtered.forEach(user => {
      body.appendChild(buildRow(user));
    });
  }

  function buildRow(user) {
    const tr = document.createElement("tr");

    // الإيميل
    const tdEmail = document.createElement("td");
    tdEmail.className = "email";
    tdEmail.textContent = user.email;
    tr.appendChild(tdEmail);

    // الاسم
    const tdName = document.createElement("td");
    const nameInput = document.createElement("input");
    nameInput.type = "text";
    nameInput.value = user.name || "";
    tdName.appendChild(nameInput);
    tr.appendChild(tdName);

    // الأدوات (checkboxes)
    const tdTools = document.createElement("td");
    const grid = document.createElement("div");
    grid.className = "tools-grid";
    const checkboxes = {};
    TOOL_CATALOG.forEach(tool => {
      const label = document.createElement("label");
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = (user.tools || []).includes(tool.key);
      checkboxes[tool.key] = cb;
      label.appendChild(cb);
      label.appendChild(document.createTextNode(tool.label));
      grid.appendChild(label);
    });
    tdTools.appendChild(grid);
    tr.appendChild(tdTools);

    // الحالة (مفعّل / أدمن)
    const tdStatus = document.createElement("td");
    const statusWrap = document.createElement("div");
    statusWrap.className = "switch-row";

    const activeSwitch = buildSwitch("مفعّل", user.active, checked => {
      postJson("/api/admin/toggle-active", {
        admin_email: adminEmail,
        user_id: user.id,
        active: checked,
      }).then(res => {
        if (!res || !res.success) { loadUsers(); return; }
        user.active = checked;
      });
    });

    const adminSwitch = buildSwitch("أدمن", user.is_admin, checked => {
      postJson("/api/admin/toggle-admin", {
        admin_email: adminEmail,
        user_id: user.id,
        is_admin: checked,
      }).then(res => {
        if (!res || !res.success) {
          alert(res && res.message ? res.message : "تعذر تنفيذ الطلب");
          loadUsers();
          return;
        }
        user.is_admin = checked;
      });
    });

    statusWrap.appendChild(activeSwitch);
    statusWrap.appendChild(adminSwitch);
    tdStatus.appendChild(statusWrap);
    tr.appendChild(tdStatus);

    // زر الحفظ (الاسم + الأدوات)
    const tdActions = document.createElement("td");
    const actionsWrap = document.createElement("div");
    actionsWrap.className = "row-actions";

    const saveBtn = document.createElement("button");
    saveBtn.className = "btn small";
    saveBtn.textContent = "💾 حفظ";

    const saveMsg = document.createElement("span");
    saveMsg.className = "save-msg";

    saveBtn.addEventListener("click", () => {
      saveBtn.disabled = true;
      saveMsg.textContent = "";
      saveMsg.className = "save-msg";

      const selectedTools = Object.keys(checkboxes).filter(key => checkboxes[key].checked);

      postJson("/api/admin/user-tools", {
        admin_email: adminEmail,
        user_id: user.id,
        name: nameInput.value.trim(),
        tools: selectedTools,
      }).then(res => {
        saveBtn.disabled = false;
        if (!res || !res.success) {
          saveMsg.textContent = "فشل الحفظ";
          saveMsg.className = "save-msg err";
          return;
        }
        user.name = nameInput.value.trim();
        user.tools = selectedTools;
        saveMsg.textContent = "تم الحفظ ✓";
        setTimeout(() => { saveMsg.textContent = ""; }, 2000);
      });
    });

    const deleteBtn = document.createElement("button");
    deleteBtn.className = "btn small danger";
    deleteBtn.textContent = "🗑 حذف";

    deleteBtn.addEventListener("click", () => {
      const ok = confirm("متأكد تبي تحذف المستخدم " + user.email + "؟ هذا الإجراء ما يترجع.");
      if (!ok) return;

      deleteBtn.disabled = true;
      saveMsg.textContent = "";
      saveMsg.className = "save-msg";

      postJson("/api/admin/delete-user", {
        admin_email: adminEmail,
        user_id: user.id,
      }).then(res => {
        deleteBtn.disabled = false;
        if (!res || !res.success) {
          saveMsg.textContent = res && res.message ? res.message : "فشل الحذف";
          saveMsg.className = "save-msg err";
          return;
        }
        allUsers = allUsers.filter(u => u.id !== user.id);
        renderUsers();
      });
    });

    actionsWrap.appendChild(saveBtn);
    actionsWrap.appendChild(deleteBtn);
    actionsWrap.appendChild(saveMsg);
    tdActions.appendChild(actionsWrap);
    tr.appendChild(tdActions);

    return tr;
  }

  function buildSwitch(label, checked, onChange) {
    const wrap = document.createElement("label");
    wrap.className = "switch";

    const input = document.createElement("input");
    input.type = "checkbox";
    input.checked = !!checked;

    const track = document.createElement("span");
    track.className = "track";

    input.addEventListener("change", () => onChange(input.checked));

    wrap.appendChild(input);
    wrap.appendChild(track);
    wrap.appendChild(document.createTextNode(label));
    return wrap;
  }

  // ===== إضافة مستخدم =====
  document.getElementById("addBtn").addEventListener("click", () => {
    const emailInput = document.getElementById("newEmail");
    const nameInput = document.getElementById("newName");
    const msg = document.getElementById("addMsg");

    const email = emailInput.value.trim().toLowerCase();
    if (!email) return;

    msg.textContent = "";
    msg.className = "add-msg";

    postJson("/api/admin/users", {
      admin_email: adminEmail,
      email: email,
      name: nameInput.value.trim(),
    }).then(res => {
      if (!res || !res.success) {
        msg.textContent = res && res.message ? res.message : "فشلت الإضافة";
        msg.className = "add-msg err";
        return;
      }
      msg.textContent = "تمت الإضافة ✓";
      msg.className = "add-msg ok";
      emailInput.value = "";
      nameInput.value = "";
      loadUsers();
      setTimeout(() => { msg.textContent = ""; }, 2500);
    });
  });

  document.getElementById("searchInput").addEventListener("input", renderUsers);
  document.getElementById("refreshBtn").addEventListener("click", loadUsers);

  // ===== بدء التشغيل =====
  if (adminEmail) {
    tryLogin(adminEmail);
  }
</script>

</body>
</html>

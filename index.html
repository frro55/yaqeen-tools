<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>

<title>أدوات يقين</title>

<style>

  h1 { margin: 0 0 8px; font-size: 21px; }
  p {
    margin: 0 0 22px;
    color: #666;

  }
  .install-btn {
    display: inline-block;
    background: #A3E635;
    color: #1a1a1a;
    border: none;
    border-radius: 10px;
    padding: 14px 40px;

    font-weight: bold;
